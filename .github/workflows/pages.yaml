# Build Hugo e publica o site na branch gh-pages.
# Em Settings > Pages: Source = "Deploy from a branch", Branch = "gh-pages", Folder = "/ (root)".
# Assim o GitHub serve o site gerado pelo Hugo, não o README do repositório.
name: Deploy Hugo to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write  # necessário para push na branch gh-pages

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      # Hextra exige Hugo >= 0.146.0 (WARN: Module not compatible with this Hugo version)
      HUGO_VERSION: 0.152.2
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: false

      - name: Generate index
        run: ruby scripts/generate_index.rb

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Setup Hugo
        run: |
          wget -O ${{ runner.temp }}/hugo.deb https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb \
          && sudo dpkg -i ${{ runner.temp }}/hugo.deb

      - name: Build with Hugo
        env:
          HUGO_ENVIRONMENT: production
          HUGO_ENV: production
        run: |
          hugo --gc --minify --baseURL "https://${{ github.repository_owner }}.github.io/"

      - name: Verify build
        run: test -f public/index.html || (echo "Hugo did not generate public/index.html" && exit 1)

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          force_orphan: true
          user_name: "github-actions[bot]"
          user_email: "github-actions[bot]@users.noreply.github.com"
